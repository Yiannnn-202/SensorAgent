# This records the local red_block_v0 run. The dataset and output stay outside Git.
model: IDEA-Research/grounding-dino-tiny
manifest: data/vision/team/red_block_v2/grounding_dino_train_val.jsonl
output_dir: runs/vision/train/grounding_dino_red_block_v0/output

# class_labels use this exact prompt order.
classes:
  - red block

training:
  epochs: 10
  batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.00001
  weight_decay: 0.0001
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  image_shortest_edge: 512
  image_longest_edge: 768
  num_workers: 0
  seed: 42
  device: cuda:0
  amp: false
