agent:
  name: sensoragent
  mode: mock
  default_skill: mock.pick_and_place

tools:
  enabled:
    - vision.mock_detect
    - audio.mock_transcribe
    - robot.mock_pick
    - robot.mock_place

skills:
  enabled:
    - mock.pick_and_place

logging:
  level: info
  console: true
  app_log: logs/app.log
  task_dir: logs/tasks
  trace_dir: logs/traces
  error_dir: logs/errors
