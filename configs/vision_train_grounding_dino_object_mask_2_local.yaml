# Local simulation fine-tuning only. The source archive and checkpoints stay
# outside Git; this config records the reproducible three-class prompt order.
model: IDEA-Research/grounding-dino-tiny
manifest: ../_analysis_object_mask_2_20260812/manifests/manifest_all.jsonl
output_dir: runs/vision/train/grounding_dino_object_mask_2_20260812

classes:
  - hex nut
  - roller
  - short bolt

training:
  epochs: 10
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.00001
  weight_decay: 0.0001
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  image_shortest_edge: 512
  image_longest_edge: 768
  num_workers: 0
  seed: 42
  device: cuda:0
  amp: false
