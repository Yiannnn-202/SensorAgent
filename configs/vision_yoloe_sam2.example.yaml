agent:
  name: sensoragent
  mode: vision_yoloe_sam2

tools:
  enabled:
    - vision.open_vocab_detect

skills:
  enabled: []

integrations:
  vision:
    # Keep this route separate from Grounding DINO + SAM 2. Replace only
    # model_path after recording the supplied YOLOE model version and checksum.
    backend: yoloe
    model_path: models/vision/yoloe.pt
    sam2_model_path: models/vision/sam2_t.pt
    box_threshold: 0.35
    text_threshold: 0.25
    # Select and freeze this only after validation. Null preserves the
    # supplied model's recorded Ultralytics default for the initial run.
    nms_iou_threshold: null
    refine_masks: true
    # A comparison labelled "YOLOE + SAM 2" must not silently use a detector
    # box when SAM 2 fails. Tune score/NMS only on validation data.
    require_masks: true
    depth_scale: 1.0
    camera_frame: camera_color_optical_frame
    base_frame: base_link

logging:
  level: info
  console: true
  app_log: logs/app.log
  task_dir: logs/tasks
  trace_dir: logs/traces
  error_dir: logs/errors
