# This is the local evaluation configuration for red_block_v0.
# The checkpoint, SAM 2 weight, data, and evaluation outputs stay outside Git.
agent:
  name: sensoragent
  mode: vision_grounded_sam2_red_block_v0

tools:
  enabled:
    - vision.grounded_sam2

skills:
  enabled: []

integrations:
  vision:
    grounding_dino_model: runs/vision/train/grounding_dino_red_block_v0/output/checkpoint-best
    sam2_model_path: models/vision/sam2_t.pt
    # Selected on val, then kept fixed for the test split.
    box_threshold: 0.05
    text_threshold: 0.05
    device: "0"
    depth_scale: 1.0
    camera_frame: camera_color_optical_frame
    base_frame: base_link

logging:
  level: info
  console: true
  app_log: logs/app.log
  task_dir: logs/tasks
  trace_dir: logs/traces
  error_dir: logs/errors
