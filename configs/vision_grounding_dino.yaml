agent:
  name: sensoragent
  mode: vision_grounding_dino

tools:
  enabled:
    - vision.open_vocab_detect

skills:
  enabled: []

integrations:
  vision:
    backend: grounding_dino
    grounding_dino_model: IDEA-Research/grounding-dino-tiny
    sam2_model_path: models/vision/sam2_t.pt
    box_threshold: 0.35
    text_threshold: 0.25
    refine_masks: true
    require_masks: false
    depth_scale: 1.0
    camera_frame: camera_color_optical_frame
    base_frame: base_link

logging:
  level: info
  console: true
  app_log: logs/app.log
  task_dir: logs/tasks
  trace_dir: logs/traces
  error_dir: logs/errors
