# This is not an optimizer-state resume.  It starts a new reproducible run
# from the completed one-epoch public mechanical checkpoint.
model: runs/vision/train/grounding_dino_public_mechanical_full_20260812_retry/checkpoint-best
manifest: data/vision/public/mechanical_parts_2022/manifests/mechanical_parts_train_val.jsonl
output_dir: runs/vision/train/grounding_dino_public_mechanical_reinitialized_9epochs_20260812

classes:
  - bearing
  - bolt
  - gear
  - nut

training:
  epochs: 9
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.00001
  weight_decay: 0.0001
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  image_shortest_edge: 512
  image_longest_edge: 768
  num_workers: 0
  seed: 42
  device: cuda:0
  amp: false
