agent:
  name: sensoragent
  mode: robot_sim

tools:
  enabled:
    - robot.get_state
    - robot.move_joints
    - robot.move_pose
    - robot.move_linear
    - robot.stop
    - gripper.open
    - gripper.close
    - gripper.get_state

skills:
  enabled:
    - robot.pick
    - robot.place

integrations:
  robot:
    backend: http
    endpoint: http://127.0.0.1:8765
    timeout_seconds: 120.0

logging:
  level: info
  console: true
  app_log: logs/app.log
  task_dir: logs/tasks
  trace_dir: logs/traces
  error_dir: logs/errors
