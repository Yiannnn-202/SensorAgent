agent:
  name: sensoragent
  mode: robot_sim

tools:
  enabled:
    - robot.get_state
    - robot.move_joints
    - robot.move_pose
    - robot.move_linear
    - robot.plan_top_down_pick
    - robot.plan_oriented_pick
    - robot.plan_place
    - robot.resolve_place_target
    - robot.stop
    - gripper.open
    - gripper.close
    - gripper.get_state
    - vision.mock_detect

skills:
  enabled:
    - robot.pick
    - robot.place
    - robot.verify_grasp
    - robot.verify_place

integrations:
  robot:
    backend: http
    endpoint: http://127.0.0.1:8765
    timeout_seconds: 120.0

logging:
  level: info
  console: true
  app_log: logs/app.log
  task_dir: logs/tasks
  trace_dir: logs/traces
  error_dir: logs/errors
