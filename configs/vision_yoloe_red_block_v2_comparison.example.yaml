agent:
  name: sensoragent
  mode: vision_yoloe_red_block_v2_comparison

tools:
  enabled:
    - vision.open_vocab_detect

skills:
  enabled: []

integrations:
  vision:
    backend: yoloe
    model_path: yoloe-11s-seg.pt
    sam2_model_path: models/vision/sam2_t.pt
    # Selected on red_block_v2 validation and frozen for test.
    box_threshold: 0.005
    text_threshold: 0.005
    nms_iou_threshold: 0.55
    refine_masks: true
    require_masks: true
    depth_scale: 1.0
    camera_frame: camera_color_optical_frame
    base_frame: base_link

logging:
  level: info
  console: true
  app_log: logs/app.log
  task_dir: logs/tasks
  trace_dir: logs/traces
  error_dir: logs/errors
