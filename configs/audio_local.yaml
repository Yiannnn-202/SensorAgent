agent:
  name: sensoragent
  mode: audio_local
  default_skill: mock.pick_and_place

tools:
  enabled:
    - audio.listen_transcribe
    - audio.transcribe
    - audio.speak
    - vision.mock_detect
    - robot.mock_pick
    - robot.mock_place

skills:
  enabled:
    - mock.pick_and_place

integrations:
  audio:
    backend: local
    asr_model_dir: models/asr/sense-voice
    tts_model_dir: models/tts
    asr_provider: cpu
    asr_num_threads: 4
  microphone:
    backend: sounddevice

logging:
  level: info
  console: true
  app_log: logs/app.log
  task_dir: logs/tasks
  trace_dir: logs/traces
  error_dir: logs/errors
