agent:
  name: sensoragent
  mode: audio_local

tools:
  enabled:
    - audio.listen_transcribe
    - audio.listen_vad_transcribe
    - audio.transcribe
    - audio.speak

skills:
  enabled:
    - audio.listen_command
    - audio.announce

integrations:
  audio:
    backend: local
    asr_model_dir: models/asr/sense-voice
    tts_model_dir: models/tts
    asr_provider: cpu
    asr_num_threads: 4
    listen_duration_seconds: 8
    listen_language: zh
    vad_model_path: models/asr/vad/silero_vad.onnx
    vad_threshold: 0.35
    vad_min_rms: 0.025
    vad_min_speech_windows: 2
    vad_pre_roll_ms: 120
    vad_post_roll_ms: 2500
    vad_tail_padding_ms: 700
    vad_max_utterance_sec: 15
  microphone:
    backend: sounddevice_vad

logging:
  level: info
  console: true
  app_log: logs/app.log
  task_dir: logs/tasks
  trace_dir: logs/traces
  error_dir: logs/errors
