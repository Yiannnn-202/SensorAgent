agent:
  name: sensoragent
  mode: vision_yoloe

tools:
  enabled:
    - vision.open_vocab_detect

skills:
  enabled: []

integrations:
  vision:
    backend: yoloe
    model_path: models/vision/yoloe.pt
    box_threshold: 0.35
    text_threshold: 0.25
    refine_masks: false
    require_masks: false
    depth_scale: 1.0
    camera_frame: camera_color_optical_frame
    base_frame: base_link

logging:
  level: info
  console: true
  app_log: logs/app.log
  task_dir: logs/tasks
  trace_dir: logs/traces
  error_dir: logs/errors
