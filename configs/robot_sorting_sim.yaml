agent:
  name: sensoragent
  mode: robot_sim

tools:
  enabled:
    - robot.get_state
    - robot.move_joints
    - robot.move_pose
    - robot.move_linear
    - robot.stop
    - robot.plan_top_down_pick
    - robot.plan_place
    - robot.resolve_place_target
    - gripper.open
    - gripper.close
    - gripper.get_state
    - vision.config_detect
    - audio.listen_transcribe
    - audio.listen_vad_transcribe
    - audio.transcribe
    - audio.speak

skills:
  enabled:
    - robot.pick
    - robot.place
    - robot.verify_grasp
    - robot.verify_place
    - audio.listen_command
    - audio.announce

integrations:
  robot:
    backend: http
    endpoint: http://127.0.0.1:8765
    # Must exceed the bridge timeout while Gazebo runs below real time on WSL.
    timeout_seconds: 720.0
  audio:
    backend: local
    asr_model_dir: models/asr/sense-voice
    tts_model_dir: models/tts
    asr_provider: cpu
    asr_num_threads: 4
    listen_duration_seconds: 8
    listen_language: zh
    vad_model_path: models/asr/vad/silero_vad.onnx
    vad_threshold: 0.35
    vad_min_rms: 0.0
    vad_min_speech_windows: 2
    vad_pre_roll_ms: 120
    vad_post_roll_ms: 2500
    vad_tail_padding_ms: 700
    vad_max_utterance_sec: 15
  microphone:
    backend: sounddevice_vad

scene:
  robot_joint_order: [joint1, joint2, joint3, joint4, joint5, joint6]
  joint_poses:
    # Select the short, table-clear inverse-kinematics branch from the home pose.
    observe_joints: [-0.000033, -1.039069, 1.044687, 0.000004, 1.575183, -0.000097]
    pick_staging_joints: [-0.625491, 0.049990, 1.435840, 0.0, 1.655755, 2.516105]
    place_staging_joints: [-0.625491, 0.049990, 1.435840, 0.0, 1.655755, 2.516105]
  objects:
    # Generic category names retain the center instance for deterministic demos.
    roller: [-0.2625, 0.22, 0.14, 0.0, 0.0, 0.0]
    滚轮: [-0.2625, 0.22, 0.14, 0.0, 0.0, 0.0]
    metal_roller_01: [-0.1625, 0.22, 0.14, 0.0, 0.0, 0.0]
    metal_roller_02: [-0.2625, 0.22, 0.14, 0.0, 0.0, 0.0]
    metal_roller_03: [-0.3625, 0.22, 0.14, 0.0, 0.0, 0.0]
    hex_nut: [-0.2625, 0.13, 0.1325, 0.0, 0.0, 0.0]
    六角螺母: [-0.2625, 0.13, 0.1325, 0.0, 0.0, 0.0]
    metal_hex_nut_01: [-0.1625, 0.13, 0.1325, 0.0, 0.0, 0.0]
    metal_hex_nut_02: [-0.2625, 0.13, 0.1325, 0.0, 0.0, 0.0]
    metal_hex_nut_03: [-0.3625, 0.13, 0.1325, 0.0, 0.0, 0.0]
    short_bolt: [-0.2625, 0.04, 0.1525, 0.0, 0.0, 0.0]
    短螺栓: [-0.2625, 0.04, 0.1525, 0.0, 0.0, 0.0]
    metal_short_bolt_01: [-0.1625, 0.04, 0.1525, 0.0, 0.0, 0.0]
    metal_short_bolt_02: [-0.2625, 0.04, 0.1525, 0.0, 0.0, 0.0]
    metal_short_bolt_03: [-0.3625, 0.04, 0.1525, 0.0, 0.0, 0.0]
  release_profiles:
    default: {opening: 0.0848, place_z: 0.25, pick_offset_z: 0.04, grasp_orientation: [0.0, 1.0, 0.0, 0.0]}
    # For horizontal long parts whose long axis is along base_link X, rotate the
    # top-down gripper 90 degrees so the fingers close across the short width.
    # Open only enough to release each part while keeping the fingers below the bin walls.
    roller: {opening: 0.063, place_z: 0.22, grasp_orientation: [0.70710678, 0.70710678, 0.0, 0.0]}
    滚轮: {opening: 0.063, place_z: 0.22, grasp_orientation: [0.70710678, 0.70710678, 0.0, 0.0]}
