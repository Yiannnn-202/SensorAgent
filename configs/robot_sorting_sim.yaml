    bin_cell_6: {position: [-0.360, -0.210, 0.25], orientation: [0.0, 1.0, 0.0, 0.0], frame_id: base_link}
    bin_cell_7: {position: [-0.167, -0.323, 0.25], orientation: [0.0, 1.0, 0.0, 0.0], frame_id: base_link}
    bin_cell_8: {position: [-0.280, -0.323, 0.25], orientation: [0.0, 1.0, 0.0, 0.0], frame_id: base_link}
  workspace:
    frame: base_link
    x: [-0.59, -0.09]
    y: [-0.375, 0.375]
    z: [0.10, 0.30]
    table_z: 0.12

logging:
  level: info
  console: true
  app_log: logs/app.log
  task_dir: logs/tasks
  trace_dir: logs/traces
  error_dir: logs/errors
