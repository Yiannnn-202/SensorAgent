    metal_hex_nut_02: {opening: 0.063, place_z: 0.22}
    metal_hex_nut_03: {opening: 0.063, place_z: 0.22}
    short_bolt: {opening: 0.063, grasp_opening: 0.020, place_z: 0.24, pick_offset_z: 0.035}
    短螺栓: {opening: 0.063, grasp_opening: 0.020, place_z: 0.24, pick_offset_z: 0.035}
    metal_short_bolt_01: {opening: 0.063, grasp_opening: 0.020, place_z: 0.24, pick_offset_z: 0.035}
    metal_short_bolt_02: {opening: 0.063, grasp_opening: 0.020, place_z: 0.24, pick_offset_z: 0.035}
    metal_short_bolt_03: {opening: 0.063, grasp_opening: 0.020, place_z: 0.24, pick_offset_z: 0.035}
  place_targets:
    bin_cell_1: {position: [-0.167, -0.097, 0.25], orientation: [0.0, 1.0, 0.0, 0.0], frame_id: base_link}
    bin_cell_2: {position: [-0.280, -0.097, 0.25], orientation: [0.0, 1.0, 0.0, 0.0], frame_id: base_link}
    bin_cell_3: {position: [-0.393, -0.097, 0.25], orientation: [0.0, 1.0, 0.0, 0.0], frame_id: base_link}
    bin_cell_4: {position: [-0.167, -0.210, 0.25], orientation: [0.0, 1.0, 0.0, 0.0], frame_id: base_link}
