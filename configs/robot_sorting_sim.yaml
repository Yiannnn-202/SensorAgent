agent:
  name: sensoragent
  mode: robot_sim

tools:
  enabled:
    - robot.get_state
    - robot.move_joints
    - robot.move_pose
    - robot.move_linear
    - robot.plan_top_down_pick
    - robot.plan_place
    - robot.resolve_place_target
    - gripper.open
    - gripper.close
    - gripper.get_state
    - vision.config_detect
    - audio.listen_transcribe
    - audio.listen_vad_transcribe
    - audio.transcribe
    - audio.speak

skills:
  enabled:
    - robot.pick
    - robot.place
    - robot.verify_grasp
    - robot.verify_place
    - audio.listen_command
    - audio.announce

integrations:
  robot:
    backend: http
    endpoint: http://127.0.0.1:8765
    # Must exceed the bridge timeout while Gazebo runs below real time on WSL.
    timeout_seconds: 720.0
  audio:
    backend: local
    asr_model_dir: models/asr/sense-voice
    tts_model_dir: models/tts
    asr_provider: cpu
    asr_num_threads: 4
    listen_duration_seconds: 8
    listen_language: zh
    vad_model_path: models/asr/vad/silero_vad.onnx
    vad_threshold: 0.35
    vad_min_rms: 0.025
    vad_min_speech_windows: 2
    vad_pre_roll_ms: 120
    vad_post_roll_ms: 2500
    vad_tail_padding_ms: 700
    vad_max_utterance_sec: 15
  microphone:
    backend: sounddevice_vad

scene:
  robot_joint_order: [joint1, joint2, joint3, joint4, joint5, joint6]
  joint_poses:
    # Select the short, table-clear inverse-kinematics branch from the home pose.
    pick_staging_joints: [-0.625491, 0.049990, 1.435840, 0.0, 1.655755, 2.516105]
    place_staging_joints: [-0.625491, 0.049990, 1.435840, 0.0, 1.655755, 2.516105]
  objects:
    block: [-0.22, 0.12, 0.15, 0.0, 0.0, 0.0]
    metal_block_01: [-0.22, 0.12, 0.15, 0.0, 0.0, 0.0]
    方块: [-0.22, 0.12, 0.15, 0.0, 0.0, 0.0]
    stepped_shaft: [-0.16, 0.17, 0.145, 0.0, 0.0, 0.0]
    阶梯轴: [-0.16, 0.17, 0.145, 0.0, 0.0, 0.0]
    hollow_sleeve: [-0.16, 0.06, 0.1425, 0.0, 0.0, 0.0]
