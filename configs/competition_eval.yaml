extends: robot_sorting_sim.yaml

agent:
  mode: competition_eval

integrations:
  robot:
    backend: fake
  vision:
    backend: grounding_dino
    recovery_live_detect: false

tools:
  enabled:
    - robot.get_state
    - robot.move_joints
    - robot.move_pose
    - robot.move_linear
    - robot.stop
    - robot.plan_top_down_pick
    - robot.plan_oriented_pick
    - robot.plan_place
    - robot.resolve_place_target
    - gripper.open
    - gripper.close
    - gripper.get_state
    - vision.config_detect
    - vision.verify_object_lifted
    - vision.verify_object_in_bin
    - recovery.classify_failure
    - recovery.plan
