# Public pretraining keeps broad Mechanical Parts Dataset concepts unchanged.
model: IDEA-Research/grounding-dino-tiny
manifest: data/vision/public/mechanical_parts_2022/mechanical_parts_train_val.jsonl
output_dir: runs/vision/train/grounding_dino_public_mechanical

classes:
  - bearing
  - bolt
  - gear
  - nut

training:
  epochs: 10
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.00001
  weight_decay: 0.0001
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  image_shortest_edge: 512
  image_longest_edge: 768
  num_workers: 0
  seed: 42
  device: cuda:0
  amp: true
