extends: robot_hardware_sensoragent_v1i_baseline.yaml


logging:
  console: true


integrations:
  vision:
    backend: yolo_seg
    model_path: /home/hcn/Island-Arm/models/combined.pt
    refine_masks: false
    require_masks: true
    first_detection_preview_gui: true

scene:
  pick_profiles:
    roller_calibration:
      # Approach-only calibration starts from raw vision centroid data. It is
      # not used by automatic roller picking.
      planner: robot.plan_short_bolt_pick
      grasp_point_mode: centroid
      position_offset: [0.015, 0.0, 0.015]
      orientation: [0.98824, 0.002022, -0.152897, 0.000599]
      lock_orientation: true
      approach_distance: 0.12
      tcp_offset: [0.0, 0.0, 0.131]
      open_opening: 0.120
      gripper_speed: 0.5
      minimum_safe_z: 0.14
      workspace_min: [-0.55, -0.26, 0.0]
      workspace_max: [-0.20, 0.18, 0.35]
    hex_nut_calibration:
      # Raw centroid approach only. Do not use this profile for automatic picks.
      planner: robot.plan_short_bolt_pick
      grasp_point_mode: centroid
      position_offset: [0.0, 0.0, 0.030]
      orientation: [0.98824, 0.002022, -0.152897, 0.000599]
      lock_orientation: true
      approach_distance: 0.12
      tcp_offset: [0.0, 0.0, 0.131]
      minimum_safe_z: 0.14
      workspace_min: [-0.55, -0.26, 0.0]
      workspace_max: [-0.20, 0.18, 0.35]
    roller:
      # Verify the point-cloud PCA long axis for every capture so the gripper
      # yaw follows a roller that is rotated on the work surface.
      enabled: true
      planner: robot.plan_short_bolt_pick
      grasp_point_mode: centroid
      position_offset: [0.015, 0.0, 0.018]
      orientation: [0.98824, 0.002022, -0.152897, 0.000599]
      lock_orientation: false
      approach_distance: 0.12
      pregrasp_distance: 0.04
      lift_height: 0.12
      tcp_offset: [0.0, 0.0, 0.131]
      open_opening: 0.120
      open_min_opening: 0.108
      close_opening: 0.0
      gripper_force: 1.0
      gripper_speed: 0.8
      require_grasp_confirmation: true
      motion_speed: 1.0
      descent_speed: 1.0
      lift_speed: 1.0
      headward_offset: 0.0
      camera_left_offset_px: 0.0
      camera_left_offset_m: 0.0
      # Keep the calibrated pitch and roll; align only yaw to the roller axis.
      orientation_mode: yaw_only
      minimum_safe_z: 0.14
      workspace_min: [-0.55, -0.26, 0.0]
      workspace_max: [-0.20, 0.18, 0.35]
    hex_nut:
      # A hex nut has no stable PCA long axis. Keep the wrist at the recorded
      # observe yaw so identical captures cannot choose opposite axes.
      enabled: true
      planner: robot.plan_short_bolt_pick
      grasp_point_mode: centroid
      position_offset: [0.0, 0.0, 0.027]
      orientation: [0.98824, 0.002022, -0.152897, 0.000599]
      lock_orientation: true
      approach_distance: 0.12
      pregrasp_distance: 0.04
      lift_height: 0.12
      motion_speed: 1.0
      descent_speed: 1.0
      lift_speed: 1.0
      gripper_force: 1.0
      close_opening: 0.0
      gripper_speed: 0.75
      tcp_offset: [0.0, 0.0, 0.131]
      minimum_safe_z: 0.14
      workspace_min: [-0.55, -0.26, 0.0]
      workspace_max: [-0.20, 0.18, 0.35]
