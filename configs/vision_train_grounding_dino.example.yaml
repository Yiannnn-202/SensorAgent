# Copy this file outside Git before changing paths or the agreed prompt order.
model: IDEA-Research/grounding-dino-tiny
manifest: data/vision/competition_train.jsonl
output_dir: runs/vision/train/grounding_dino_v0

# class_labels are indexes into this exact text-prompt order.
classes:
  - roller
  - gear
  - hex nut
  - short bolt
  - stepped shaft
  - flange

training:
  epochs: 30
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.00001
  weight_decay: 0.0001
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  image_shortest_edge: 512
  image_longest_edge: 768
  num_workers: 0
  seed: 42
  device: cuda:0
  amp: true
