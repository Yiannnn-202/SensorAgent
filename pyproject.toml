[project]
name = "sensoragent"
version = "0.1.0"
description = "Agent orchestration framework for embodied task skills and tools."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "requests>=2.32",
]

[project.scripts]
sensoragent = "sensoragent.services.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# These import scripts.vision_train*, which collide with a ROS environment's
# `scripts` package (/opt/ros/*/lib/python3.*/dist-packages/scripts, needing
# catkin_pkg) and cannot be collected without a sourced ROS workspace. Ignore
# them so the suite collects cleanly both locally and in CI. Run one directly
# with `python -m pytest <file> -o addopts=""` from a sourced ROS env.
addopts = "--ignore=tests/unit/test_vision_coco_audit.py --ignore=tests/unit/test_vision_coco_segmentation_to_eval.py --ignore=tests/unit/test_vision_coco_to_grounding_dino.py --ignore=tests/unit/test_vision_train.py --ignore=tests/unit/test_vision_train_grounding_dino.py"
