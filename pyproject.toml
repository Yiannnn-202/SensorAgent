[project]
name = "sensoragent"
version = "0.1.0"
description = "Agent orchestration framework for embodied task skills and tools."
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "requests>=2.32",
]

[project.scripts]
sensoragent = "sensoragent.services.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"
