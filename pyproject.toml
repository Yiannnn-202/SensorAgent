[project]
name = "sensoragent"
version = "0.1.0"
description = "Agent orchestration framework for embodied task skills and tools."
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"
